[manifest]
version = "0.0.1"
dump_lua = true
priority = 1

###transplanted my own fixes onto here

[[patches]]
[patches.regex]
target = '=[SMODS Blindside "lib/utils/utils.lua"]'
pattern = '''(.*)function BLINDSIDE.chipsupdate(.*)'''
match_indent = true
position = 'after'
payload = '''

G.GAME.blindside_current_operator = G.GAME.unik_current_operator or 0

'''

[[patches]]
[patches.regex]
target = '=[SMODS _ "src/ui.lua"]'
pattern = '''text = \"X\"'''
match_indent = true
position = 'after'
payload = ''', id = "blindside_operator_text_7777" '''

[[patches]]
[patches.regex]
target = 'functions/button_callbacks.lua'
pattern = '''(.*)SMODS.calculate_context\(\{(.*)ending_shop = true(.*)\}\)(.*)'''
match_indent = true
position = 'after'
payload = '''

G.GAME.blindside_reroll_tags_consumed = G.GAME.blindside_reroll_tags_consumed or 0
--print("reroll tags consumed:" .. G.GAME.blindside_reroll_tags_consumed)
SMODS.change_free_rerolls(-G.GAME.blindside_reroll_tags_consumed)
G.GAME.blindside_reroll_tags_consumed = 0
--print("Free rerolls remaining:" .. G.GAME.round_resets.free_rerolls)
G.GAME.shop_entered_already_blindside = nil

'''

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''if v.small or v.big then bosses_used[k] = 0 end'''
match_indent = true
position = 'after'
payload = '''
if v.cursed then bosses_used[k] = 0 end
'''

### Also, it appears blinds remaining face down even after they are played are not intentional, given a lot of chance effects only trigger if they are NOT face down.
###I'll have to fix that
### stuff like the wheel never trigger for that reason without changes

# fix for always face down cards causing chances to fail
[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = '''stay_flipped = G.GAME and G.GAME.blindassist and G.GAME.blindassist:stay_flipped(to, card, from)'''
match_indent = true
position = 'at'
payload = '''stay_flipped = G.GAME and G.GAME.blindassist and G.GAME.blindassist:stay_flipped(to, card, area)'''


#  fix for always face down cards causing chances to fail when played
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''check_for_unlock({type = 'run_card_replays'})'''
match_indent = true
position = 'before'
payload = '''
if BLINDSIDE.hasBlindside() then
    for i = 1, #G.hand.highlighted do
        if G.hand.highlighted[i].facing == 'back' then
            G.hand.highlighted[i]:flip()
            
        end
    end
end
'''

