[manifest]
version = "0.0.1"
dump_lua = true
priority = 99999

### Rn, blindside's card drawing shennanigans is breaking smod's existing one, here's my veresipn

##reshuffling and tech blind stuff
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''elseif G.STATE == G.STATES.SELECTING_HAND and #G.deck.cards > 0 and self.config.card_limits.old_slots < self.config.card_limits.total_slots then'''
position = "before"
payload = '''
elseif BLINDSIDE.hasBlindside() and G.STATE == G.STATES.SELECTING_HAND and #G.deck.cards <= 0  and self.config.card_limits.old_slots < self.config.card_limits.total_slots then
    if (self.config.card_limits.total_slots - self.config.card_limits.old_slots) > 0 then
        BLINDSIDE.reshuffle()
    end
'''
match_indent = true

##crash fix
[[patches]]
[patches.regex]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''and self.config.card_limits.old_slots'''
position = "before"
payload = ''' and self.config.card_limits and self.config.card_limits.old_slots '''
match_indent = true

##reshuffling and tech blind stuff
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''if self == G.hand then check_for_unlock({type = 'min_hand_size'}) end'''
position = "after"
payload = '''
if G.hand and self == G.hand and (self.config.card_count or 0) + (SMODS.cards_to_draw or 0) >= (self.config.card_limits.total_slots or 0) then
    if BLINDSIDE.hasBlindside() and G.STATE == G.STATES.SELECTING_HAND and #G.deck.cards > 0 then
        if self.config.card_limits and self.config.card_limits.old_slots and (self.config.card_limits.total_slots - self.config.card_limits.old_slots) <= 0 then
           -- print("techdraw1")
            --print(G.GAME.can_draw_tech)
            BLINDSIDE.tech_draw()
        end
    --tech blinds btw cannot reshuffle the deck
    end
end
'''
match_indent = true


